<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Detail — Sokha Beauty & Wellness (C033 Demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="shop">

<div id="site-header"></div>

<div class="page-hero">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a> / <a href="shop.html">Shop</a> / <span id="crumbName">Product</span></div>
  </div>
</div>

<div class="container section" id="pdpArea"></div>

<div class="container section">
  <div class="section-head"><h4>Related Products</h4></div>
  <div class="prod-grid" id="relatedGrid"></div>
</div>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/layout.js"></script>
<script>
function qparam(name){ return new URLSearchParams(window.location.search).get(name); }
const p = findProduct(qparam('id')) || PRODUCTS[0];
document.title = p.name + ' — Sokha Beauty & Wellness (C033 Demo)';
document.getElementById('crumbName').textContent = p.name;

const st = stockLabel(p);
document.getElementById('pdpArea').innerHTML = `
  <div class="pdp-grid">
    <div>
      <div class="pdp-gallery-main"><img id="pdpMainImg" src="${p.images[0]}" onerror="imgFallback(this,'${CAT_NAME[p.category]}')"></div>
      <div class="pdp-thumbs">${p.images.map((im,i)=>`<img src="${im}" class="${i===0?'active':''}" onclick="document.getElementById('pdpMainImg').src=this.src" onerror="imgFallback(this,'${CAT_NAME[p.category]}')">`).join('')}</div>
    </div>
    <div>
      <div class="prod-badges" style="position:static; display:flex; margin-bottom:8px;">${badgeHTML(p)}</div>
      <h1 style="font-size:1.6rem">${p.name}</h1>
      <div class="pdp-sku">SKU: ${p.sku} · Brand: ${p.brand} · Category: ${CAT_NAME[p.category]} · Weight: ${p.weight} kg</div>
      <div class="prod-rating mt-16">${starHTML(p.rating)} <span>${p.rating.toFixed(1)} (${p.reviews} reviews)</span></div>
      <div class="pdp-price-row"><span class="price-now" style="font-size:1.4rem">${fmt(p.promoPrice||p.price)}</span>${p.promoPrice?`<span class="price-old">${fmt(p.price)}</span>`:''}</div>
      <div class="pdp-points"><i class="bi bi-gem"></i> Earn ${p.points} loyalty points</div>
      <div class="prod-stock ${st.cls}">${st.text}</div>
      <div class="pdp-meta-row mt-16"><span><i class="bi bi-box-seam"></i> Weight: ${p.weight} kg</span><span><i class="bi bi-truck"></i> ${p.deliveryEstimate}</span></div>
      ${p.type==='preorder' ? `
      <div class="preorder-box">
        <b><i class="bi bi-hourglass-split"></i> Pre-Order Item</b><br>
        Expected availability: <b>${p.preorder.expectedAvailability}</b><br>
        Estimated delivery: ${p.preorder.estimatedDelivery}<br>
        ${p.preorder.depositLabel} required to reserve.<br>
        ${p.preorder.limitedBatch}<br>
        <span class="text-muted" style="font-size:.75rem">Final date is subject to confirmation and may change.</span>
      </div>` : ''}
      <div class="qty-selector mt-16"><button id="pdpQtyMinus">−</button><input type="number" id="pdpQty" value="1" min="1"><button id="pdpQtyPlus">+</button></div>
      <div class="pdp-cta-row">
        <button class="btn btn-primary" id="pdpAddCart" ${p.type!=='preorder'&&p.stock<=0?'disabled':''}>${p.type==='preorder'?'Reserve Pre-Order':'Add to Cart'}</button>
        <button class="btn btn-outline" id="pdpBuyNow">Buy Now</button>
        <button class="btn-icon" id="pdpWish"><i class="bi ${wishlist.includes(p.id)?'bi-heart-fill':'bi-heart'}"></i></button>
      </div>
      <div class="pdp-tabs">
        <div class="pdp-tab active" data-tab="desc">Description</div>
        <div class="pdp-tab" data-tab="benefits">Benefits</div>
        <div class="pdp-tab" data-tab="ingredients">Ingredients</div>
        <div class="pdp-tab" data-tab="usage">Usage</div>
      </div>
      <div class="pdp-tab-panel active" data-panel="desc">${p.description}</div>
      <div class="pdp-tab-panel" data-panel="benefits"><ul>${p.benefits.map(b=>`<li>• ${b}</li>`).join('')}</ul></div>
      <div class="pdp-tab-panel" data-panel="ingredients">${p.ingredients}</div>
      <div class="pdp-tab-panel" data-panel="usage">${p.usage}</div>
    </div>
  </div>`;

document.querySelectorAll('.pdp-tab').forEach(t=>t.addEventListener('click', ()=>{
  document.querySelectorAll('.pdp-tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.pdp-tab-panel').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); document.querySelector(`[data-panel="${t.dataset.tab}"]`).classList.add('active');
}));
document.getElementById('pdpQtyMinus').onclick = ()=>{ const i=document.getElementById('pdpQty'); i.value=Math.max(1,+i.value-1); };
document.getElementById('pdpQtyPlus').onclick = ()=>{ const i=document.getElementById('pdpQty'); i.value=+i.value+1; };
document.getElementById('pdpAddCart').onclick = ()=>{ addToCart(p.id, +document.getElementById('pdpQty').value); };
document.getElementById('pdpBuyNow').onclick = ()=>{ addToCart(p.id, +document.getElementById('pdpQty').value); window.location.href='cart.html'; };
document.getElementById('pdpWish').onclick = (e)=>{ toggleWishlist(p.id, null); e.target.closest('button').querySelector('i').className='bi '+(wishlist.includes(p.id)?'bi-heart-fill':'bi-heart'); };

renderGrid('relatedGrid', PRODUCTS.filter(r=>r.category===p.category && r.id!==p.id).slice(0,4));
</script>
</body>
</html>
