<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — Sokha Beauty & Wellness (C033 Demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="account">

<div id="site-header"></div>

<div class="page-hero"><div class="container"><div class="breadcrumb"><a href="index.html">Home</a> / <a href="profile.html">My Account</a> / Orders</div><h1>My Orders</h1></div></div>

<div class="container section">
  <div class="account-layout">
    <ul class="account-menu">
      <li><a href="profile.html"><i class="bi bi-person"></i> Profile</a></li>
      <li><a href="profile.html?tab=addresses"><i class="bi bi-geo-alt"></i> Saved Addresses</a></li>
      <li><a href="profile.html?tab=wishlist"><i class="bi bi-heart"></i> Wishlist</a></li>
      <li><a href="orders.html" class="active"><i class="bi bi-bag-check"></i> My Orders</a></li>
      <li><a href="tracking.html"><i class="bi bi-truck"></i> Track Order</a></li>
      <li><a href="loyalty.html"><i class="bi bi-gem"></i> Loyalty Points</a></li>
    </ul>
    <div>
      <table class="acc-table">
        <thead><tr><th>Order #</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr></thead>
        <tbody id="ordersTableBody"></tbody>
      </table>
      <div id="orderDetailBox" class="mt-16"></div>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/layout.js"></script>
<script>
document.getElementById('ordersTableBody').innerHTML = orders.slice().reverse().map(o=>`
  <tr><td>${o.orderNo}</td><td>${o.date}</td><td>${o.items.length} item(s)</td><td>${fmt(o.total)}</td>
  <td><span class="status-pill">${o.status}</span></td>
  <td><button class="btn btn-sm btn-light" data-view="${o.orderNo}">View</button> <a class="btn btn-sm btn-outline" href="tracking.html?order=${o.orderNo}">Track</a></td></tr>
`).join('') || `<tr><td colspan="6" class="text-muted" style="text-align:center; padding:24px">No orders yet. <a href="shop.html">Start shopping</a></td></tr>`;

document.getElementById('ordersTableBody').addEventListener('click', e=>{
  const btn = e.target.closest('[data-view]'); if(!btn) return;
  const o = orders.find(x=>x.orderNo===btn.dataset.view);
  document.getElementById('orderDetailBox').innerHTML = `<div class="summary-box">
    <h4>Order ${o.orderNo}</h4>
    <ul style="font-size:.85rem">${o.items.map(i=>`<li>${i.qty} × ${i.name} — ${fmt(i.price)}</li>`).join('')}</ul>
    <div class="cart-summary-row"><span>Subtotal</span><span>${fmt(o.subtotal)}</span></div>
    <div class="cart-summary-row"><span>Shipping</span><span>${fmt(o.shipping)}</span></div>
    <div class="cart-summary-row total"><span>Total</span><span>${fmt(o.total)}</span></div>
    <p class="text-muted" style="font-size:.8rem">Payment: ${o.paymentMethod} (${o.paymentStatus}) · Tracking: ${o.trackingCode}</p>
    <a class="btn btn-primary btn-sm" href="tracking.html?order=${o.orderNo}">Track This Order</a>
  </div>`;
});
</script>
</body>
</html>
