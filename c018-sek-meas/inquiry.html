<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Inquiry List | Sek Meas</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/inquiry.css"><link rel="stylesheet" href="assets/css/cleanup.css"></head><body><div id="site-header"></div><main class="container"><div class="inquiry-layout"><section class="inquiry-list"><div class="section-head"><div><span class="eyebrow">YOUR SELECTION</span><h2>Inquiry List</h2></div><button id="clear-basket" class="link-button">Clear all</button></div><p id="inquiry-count"></p><div id="inquiry-items"></div><p><a class="text-link" href="products.html">← Continue browsing</a></p></section><section class="inquiry-form-wrap"><span class="eyebrow">YOUR DETAILS</span><h2>Tell us about your needs</h2><form id="inquiry-form" class="form-grid"><label>Customer name*<input name="name" required></label><label>Phone number*<input name="phone" required></label><label>Company name<input name="company"></label><label>Customer type*<select name="type" required><option>Retailer</option><option>Wholesaler</option><option>Restaurant</option><option>Distributor</option><option>Individual</option><option>Other</option></select></label><label class="full">Note<textarea name="note" placeholder="Tell us what you need, if helpful"></textarea></label><div class="full telegram-submit"><p class="form-note">You will review and send the prepared message in Telegram.</p><button class="btn" type="submit">Send Inquiry via Telegram</button><p id="form-notice" role="status" aria-live="polite"></p><button type="button" id="copy-message" class="link-button copy-message" hidden>Telegram didn’t open? Copy message again</button></div></form></section></div></main><div id="site-footer"></div><script src="assets/js/data.js"></script><script src="assets/js/main.js"></script><script src="assets/js/inquiry.js"></script></body></html>
