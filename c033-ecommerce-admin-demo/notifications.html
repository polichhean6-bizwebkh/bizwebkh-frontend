<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — Sokha Admin Dashboard (C033 Demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
<div id="admin-root"></div>
<script src="assets/js/admin-data.js"></script>
<script src="assets/js/admin-layout.js"></script>
<script>
function onAdminReady(){
  document.getElementById('content').innerHTML = `
    <div class="page-title-row"><div><h2>Notifications</h2><div class="sub">Recent system events &amp; notification preferences (demo)</div></div></div>
    <div class="panel">
      <h4>Notification Settings</h4>
      <label style="display:flex; align-items:center; gap:10px; padding:8px 0"><input type="checkbox" id="notifOrders" ${NOTIF_SETTINGS.orders?'checked':''}> Order Notifications — new orders, cancellations, refunds</label>
      <label style="display:flex; align-items:center; gap:10px; padding:8px 0"><input type="checkbox" id="notifCustomers" ${NOTIF_SETTINGS.customers?'checked':''}> Customer Notifications — new registrations, account changes</label>
      <label style="display:flex; align-items:center; gap:10px; padding:8px 0"><input type="checkbox" id="notifPromo" ${NOTIF_SETTINGS.promo?'checked':''}> Promotion Notifications — campaign starts/ends</label>
      <button class="btn btn-primary mt-16" id="saveNotifSettings">Save Preferences (Demo)</button>
    </div>
    <div class="table-wrap mt-16"><table class="data-table"><thead><tr><th>Time</th><th>Type</th><th>Message</th></tr></thead><tbody id="notificationTableBody"></tbody></table></div>`;
  document.getElementById('notificationTableBody').innerHTML = NOTIFICATIONS.map(n=>`<tr><td>${n.time}</td><td>${n.type}</td><td>${n.msg}</td></tr>`).join('');
  document.getElementById('saveNotifSettings').addEventListener('click', ()=>{
    NOTIF_SETTINGS.orders = document.getElementById('notifOrders').checked;
    NOTIF_SETTINGS.customers = document.getElementById('notifCustomers').checked;
    NOTIF_SETTINGS.promo = document.getElementById('notifPromo').checked;
    persistAll(); toast('Notification preferences saved (demo)', 'bi-bell-fill');
  });
}
renderAdminShell('notifications');
</script>
</body>
</html>
