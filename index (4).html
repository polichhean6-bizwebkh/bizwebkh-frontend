<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart — Kanharoth Shop Demo</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="site-header" data-root="../" data-active="cart"></div>

<div class="container">
  <div class="breadcrumb">
    <a href="../index.html" data-i18n="foot_link_home">Home</a> / <span data-i18n="cart_breadcrumb">Cart</span>
  </div>
</div>

<section class="container" style="padding-bottom:60px;">
  <h1 data-i18n="cart_title" style="font-size:1.6rem;margin-bottom:20px;">Your Cart</h1>

  <div id="cart-has-items">
    <div class="cart-wrap">
      <div>
        <div id="cart-items"></div>
        <div style="margin-top:20px;">
          <a href="../shop/index.html" class="btn btn-outline" data-i18n="cart_continue">Continue Shopping</a>
        </div>
      </div>
      <div class="summary-card">
        <h3 style="margin-bottom:14px;" data-i18n="summary_title">Order Summary</h3>
        <div class="summary-row"><span data-i18n="summary_subtotal">Subtotal</span><span id="sum-subtotal"></span></div>
        <div class="summary-row"><span data-i18n="summary_discount">Discount</span><span id="sum-discount">−$0.00</span></div>
        <div class="summary-row"><span data-i18n="summary_delivery">Delivery Fee</span><span data-i18n="summary_delivery_calc" style="font-size:.78rem;color:var(--ink-faint);"></span></div>
        <div class="summary-row total"><span data-i18n="summary_total">Total</span><span id="sum-total"></span></div>
        <a href="../checkout/index.html" class="btn btn-primary btn-block" style="margin-top:14px;" data-i18n="cart_checkout">Proceed to Checkout</a>
      </div>
    </div>
  </div>

  <div id="cart-empty" class="empty-state" style="display:none;">
    <div class="icon">🛒</div>
    <h3 data-i18n="cart_empty_title">Your cart is empty</h3>
    <p data-i18n="cart_empty_desc">Browse our products and add items to your cart</p>
    <a href="../shop/index.html" class="btn btn-primary" data-i18n="cart_shop_now">Start Shopping</a>
  </div>
</section>

<div id="site-footer" data-root="../"></div>

<script src="../js/i18n.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/layout.js"></script>
<script>
function render(){
  const items = cartDetailed();
  document.getElementById("cart-has-items").style.display = items.length ? "block" : "none";
  document.getElementById("cart-empty").style.display = items.length ? "none" : "block";
  if (!items.length){ applyI18n(); return; }

  const list = document.getElementById("cart-items");
  list.innerHTML = "";
  items.forEach(i=>{
    const p = i.product;
    const name = getLang()==="km" ? p.nameKm : p.name;
    const row = document.createElement("div");
    row.className = "cart-item";
    row.innerHTML = `
      <img src="${p.img}" alt="${p.name}">
      <div>
        <div class="name">${name}</div>
        <div class="cat" data-i18n="cat_${p.category}"></div>
        <div class="price">${money(p.sale||p.price)}</div>
      </div>
      <div class="qty-selector">
        <button class="q-minus">−</button>
        <input type="text" value="${i.qty}" readonly>
        <button class="q-plus">+</button>
      </div>
      <div style="text-align:right;">
        <div style="font-weight:800;">${money((p.sale||p.price)*i.qty)}</div>
        <button class="remove" data-i18n="delete">Remove</button>
      </div>`;
    row.querySelector(".q-minus").onclick = ()=>{ setCartQty(p.id, Math.max(1,i.qty-1)); render(); };
    row.querySelector(".q-plus").onclick = ()=>{ setCartQty(p.id, i.qty+1); render(); };
    row.querySelector(".remove").onclick = ()=>{ removeFromCart(p.id); render(); };
    list.appendChild(row);
  });

  const subtotal = cartSubtotal();
  document.getElementById("sum-subtotal").textContent = money(subtotal);
  document.getElementById("sum-total").textContent = money(subtotal);
  applyI18n();
}
document.addEventListener("DOMContentLoaded", render);
document.addEventListener("langchanged", render);
</script>
</body>
</html>
