<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>Item Details · SafeMove Express Prototype</title><link rel="stylesheet" href="assets/css/style.css"></head><body><main class="phone"><div class="page with-sticky"><script src="assets/js/components.js"></script><script>document.write(head('Item details'))</script><div class="tabs"><button class="tab active">Item 1</button><button class="tab">Add item</button></div><p class="subtle">Tell us about your item so your driver can handle it with care.</p><section class="section card" style="text-align:center"><span class="mini-icon" style="margin:auto;width:62px;height:62px"><script>document.write(icon('package'))</script></span><p style="margin-bottom:0">Parcel delivery</p></section><section class="section"><h2>Size</h2><div class="size-row"><button class="chip selected" data-select="size">S<br><small>≤30 cm</small></button><button class="chip" data-select="size">M<br><small>≤50 cm</small></button><button class="chip" data-select="size">L<br><small>≤80 cm</small></button><button class="chip" data-select="size">XL<br><small>Special</small></button></div></section><section class="section card"><div class="field" style="margin-top:0"><label>Weight</label><div class="field-row"><span class="mini-icon"><script>document.write(icon('weight'))</script></span><input type="number" placeholder="0"><select class="code"><option>kg</option></select></div></div><div class="field"><label>Description</label><textarea rows="2" placeholder="e.g. Documents, shoes, electronics…"></textarea></div><div class="field"><label>Quantity</label><input type="number" value="1"></div><div class="field"><label>Item type</label><select><option>General goods</option><option>Fragile item</option><option>Document</option></select></div><div class="top-line" style="margin-top:16px"><span><b>Fragile item</b><br><small class="subtle">Handle with extra care</small></span><input class="toggle" type="checkbox" aria-label="Fragile item"></div></section><p><button type="button" class="link" style="border:0;background:transparent;padding:0" onclick="toast('Demo: Prohibited items include hazardous materials.')">What’s prohibited?</button></p></div><div class="sticky-action"><a class="btn btn-primary" href="express-delivery.html">Confirm item</a></div></main><script src="assets/js/app.js"></script></body></html>
