<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dandelion Online Learning &amp; Teaching System — Demo</title>
<link rel="icon" href="assets/images/logo.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<div class="demo-banner">
  <span class="dot"></span> DEMO ONLY — sample data, no live backend, video, or payment connected
</div>

<div class="app-shell">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="assets/images/logo.jpg" alt="Dandelion logo" class="brand-logo" />
      <div class="brand-text">
        <strong>Dandelion</strong>
        <span>International Academy</span>
      </div>
    </div>

    <nav class="nav-list" id="navList"><!-- injected by app.js --></nav>

    <div class="sidebar-footer">
      <div class="role-badge" id="sidebarRoleBadge">Admin</div>
      <div class="version">Online Learning System · v1.0 Demo</div>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Main -->
  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Toggle menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>

      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="text" id="globalSearch" placeholder="Search students, teachers, classes, assignments..." autocomplete="off" />
        <div class="search-results" id="searchResults"></div>
      </div>

      <div class="topbar-right">
        <div class="role-switch" id="roleSwitch">
          <button data-role="admin" class="role-opt">Admin</button>
          <button data-role="teacher" class="role-opt">Teacher</button>
          <button data-role="student" class="role-opt">Student</button>
        </div>

        <div class="notif-wrap">
          <button class="icon-btn" id="notifBtn" aria-label="Notifications">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="2"/></svg>
            <span class="notif-dot" id="notifDot"></span>
          </button>
          <div class="notif-panel" id="notifPanel"></div>
        </div>

        <div class="user-chip" id="userChip"></div>
      </div>
    </header>

    <main class="view" id="view"><!-- injected by app.js --></main>
  </div>
</div>

<!-- Modal root -->
<div class="modal-root" id="modalRoot"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/views-shared.js"></script>
<script src="assets/js/views-admin.js"></script>
<script src="assets/js/views-teacher.js"></script>
<script src="assets/js/views-student.js"></script>
<script src="assets/js/init.js"></script>
</body>
</html>
