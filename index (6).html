<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Detail — Kanharoth Shop Demo</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="site-header" data-root="../" data-active="shop"></div>

<div class="container">
  <div class="breadcrumb">
    <a href="../index.html" data-i18n="foot_link_home">Home</a> /
    <a href="../shop/index.html" data-i18n="shop_breadcrumb">Shop</a> /
    <span id="bc-name"></span>
  </div>
</div>

<section class="container" style="padding-bottom:30px;">
  <div class="pd-wrap" id="pd-wrap"></div>

  <div class="tabs">
    <button class="active" data-tab="desc" data-i18n="pd_tab_desc">Description</button>
    <button data-tab="spec" data-i18n="pd_tab_spec">Specification</button>
  </div>
  <div id="tab-desc"><p id="pd-desc-text"></p></div>
  <div id="tab-spec" style="display:none;">
    <table class="spec-table" id="spec-table"></table>
  </div>

  <h2 style="margin-top:50px;font-size:1.3rem;" data-i18n="pd_related">Related Products</h2>
  <div class="grid-products" id="related-grid" style="margin-top:16px;"></div>
</section>

<div id="site-footer" data-root="../"></div>

<script src="../js/i18n.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/layout.js"></script>
<script>
let currentProduct = null;
let currentQty = 1;

function render(){
  const id = qparam("id") || PRODUCTS[0].id;
  currentProduct = PRODUCTS.find(p=>p.id===id) || PRODUCTS[0];
  const p = currentProduct;
  const name = getLang()==="km" ? p.nameKm : p.name;
  document.title = name + " — Kanharoth Shop Demo";
  document.getElementById("bc-name").textContent = name;

  const stock = stockInfo(p.stock);
  const wrap = document.getElementById("pd-wrap");
  wrap.innerHTML = `
    <div class="pd-gallery">
      <div class="main-img"><img id="main-img" src="${p.img}" alt="${p.name}"></div>
      <div class="pd-thumbs">
        ${p.images.map((im,i)=>`<div class="th ${i===0?'active':''}" data-src="${im}"><img src="${im}"></div>`).join("")}
      </div>
    </div>
    <div class="pd-info">
      <span class="cat" data-i18n="cat_${p.category}"></span>
      <h1>${name}</h1>
      <div class="pd-price-row">
        <span class="pd-price">${money(p.sale||p.price)}</span>
        ${p.sale ? `<span class="price-old" style="font-size:1.1rem;">${money(p.price)}</span>` : ""}
      </div>
      <span class="stock ${stock.cls}" style="font-size:.85rem;">${stock.text}</span>
      <p style="margin-top:14px;">${getLang()==="km" ? "" : p.desc}</p>
      <div>
        <label style="font-size:.8rem;font-weight:700;color:var(--ink-soft);" data-i18n="pd_qty">Quantity</label>
        <div class="qty-selector" style="margin-top:8px;">
          <button id="qty-minus">−</button>
          <input type="text" id="qty-input" value="1" readonly>
          <button id="qty-plus">+</button>
        </div>
      </div>
      <div class="pd-actions">
        <button class="btn btn-outline btn-block" id="add-cart-btn" ${p.stock<=0?'disabled':''} data-i18n="pd_add_cart">Add to Cart</button>
        <button class="btn btn-primary btn-block" id="buy-now-btn" ${p.stock<=0?'disabled':''} data-i18n="pd_buy_now">Buy Now</button>
      </div>
      <div class="pd-meta">
        <span><b data-i18n="pd_sku">SKU</b>: ${p.sku}</span>
        <span><b data-i18n="pd_category">Category</b>: <span data-i18n="cat_${p.category}"></span></span>
        <span><b data-i18n="pd_availability">Availability</b>: ${stock.text}</span>
      </div>
    </div>`;

  document.getElementById("pd-desc-text").textContent = getLang()==="km" ? p.nameKm + " — គុណភាពល្អ តម្លៃសមរម្យ សមស្របសម្រាប់គ្រួសារ។" : p.desc;

  const specTable = document.getElementById("spec-table");
  const specRows = [
    ["pd_sku", p.sku],
    ["pd_category", t("cat_"+p.category)],
    ["pd_availability", stock.text],
  ];
  specTable.innerHTML = specRows.map(r=>`<tr><td>${t(r[0])}</td><td>${r[1]}</td></tr>`).join("");

  // related products (same category)
  const related = document.getElementById("related-grid");
  related.innerHTML = "";
  PRODUCTS.filter(x=>x.category===p.category && x.id!==p.id).slice(0,4).forEach(rp=>{
    const rname = getLang()==="km" ? rp.nameKm : rp.name;
    const rbadge = badgeLabel(rp.badge);
    const rstock = stockInfo(rp.stock);
    const card = document.createElement("div");
    card.className = "product-card";
    card.innerHTML = `
      <a href="index.html?id=${rp.id}" class="thumb">
        <img src="${rp.img}" alt="${rp.name}">
        ${rbadge ? `<span class="tag ${rbadge.cls}">${rbadge.text}</span>` : ""}
      </a>
      <div class="body">
        <span class="cat" data-i18n="cat_${rp.category}"></span>
        <a href="index.html?id=${rp.id}" class="title">${rname}</a>
        <div class="price-row"><span class="price">${money(rp.sale||rp.price)}</span></div>
        <span class="stock ${rstock.cls}">${rstock.text}</span>
      </div>
      <div class="actions">
        <a href="index.html?id=${rp.id}" class="btn btn-primary" data-i18n="view_details" style="flex:1;"></a>
      </div>`;
    related.appendChild(card);
  });

  currentQty = 1;
  applyI18n();
  bindActions();
}

function bindActions(){
  document.getElementById("qty-minus").onclick = ()=>{ currentQty = Math.max(1,currentQty-1); document.getElementById("qty-input").value = currentQty; };
  document.getElementById("qty-plus").onclick = ()=>{ currentQty = Math.min(currentProduct.stock||99,currentQty+1); document.getElementById("qty-input").value = currentQty; };
  document.getElementById("add-cart-btn").onclick = (e)=>{
    addToCart(currentProduct.id, currentQty);
    const btn = e.target; const old = btn.textContent;
    btn.textContent = "✓ " + t("add_to_cart"); setTimeout(()=>btn.textContent=old, 1200);
  };
  document.getElementById("buy-now-btn").onclick = ()=>{
    addToCart(currentProduct.id, currentQty);
    location.href = "../checkout/index.html";
  };
  document.querySelectorAll(".pd-thumbs .th").forEach(th=>{
    th.addEventListener("click", ()=>{
      document.getElementById("main-img").src = th.dataset.src;
      document.querySelectorAll(".pd-thumbs .th").forEach(x=>x.classList.remove("active"));
      th.classList.add("active");
    });
  });
  document.querySelectorAll(".tabs button").forEach(b=>{
    b.addEventListener("click", ()=>{
      document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      document.getElementById("tab-desc").style.display = b.dataset.tab==="desc" ? "block":"none";
      document.getElementById("tab-spec").style.display = b.dataset.tab==="spec" ? "block":"none";
    });
  });
}

document.addEventListener("DOMContentLoaded", render);
document.addEventListener("langchanged", render);
</script>
</body>
</html>
