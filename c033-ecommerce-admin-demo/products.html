<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products — Sokha Admin Dashboard (C033 Demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
<div id="admin-root"></div>

<div class="modal-overlay" id="productModal">
  <div class="modal-box">
    <button class="modal-close" data-close="productModal"><i class="bi bi-x-lg"></i></button>
    <div class="modal-header"><h3 id="productModalTitle">Add Product</h3></div>
    <div class="modal-body" id="productModalBody"></div>
  </div>
</div>

<script src="assets/js/admin-data.js"></script>
<script src="assets/js/admin-layout.js"></script>
<script>
function onAdminReady(){
  document.getElementById('content').innerHTML = `
    <div class="page-title-row"><div><h2>Products</h2><div class="sub">Manage catalogue (demo CRUD simulation)</div></div>
      <button class="btn btn-primary" id="addProductBtn"><i class="bi bi-plus-lg"></i> Add Product</button></div>
    <div class="table-toolbar">
      <div class="table-search"><i class="bi bi-search"></i><input id="productSearch" placeholder="Search product, SKU..."></div>
      <div class="filters">
        <select id="productCatFilter"><option value="">All Categories</option>${CATEGORIES.map(c=>`<option>${c}</option>`).join('')}</select>
        <select id="productStatusFilter"><option value="">All Status</option><option>Active</option><option>Draft</option><option>Archived</option></select>
        <select id="productTypeFilter"><option value="">All Types</option><option>Standard</option><option>Pre-Order</option></select>
      </div>
    </div>
    <div class="table-wrap"><table class="data-table">
      <thead><tr><th>Image</th><th>Name</th><th>SKU</th><th>Category</th><th>Brand</th><th>Type</th><th>Price</th><th>Promo</th><th>Cost</th><th>Weight</th><th>Stock</th><th>Status</th><th>Updated</th><th>Actions</th></tr></thead>
      <tbody id="productTableBody"></tbody>
    </table></div>`;
  document.getElementById('addProductBtn').addEventListener('click', ()=>openProductModal(null));
  ['input','change'].forEach(evt=>document.addEventListener(evt, e=>{
    if(e.target.matches('#productSearch, #productCatFilter, #productStatusFilter, #productTypeFilter')) renderProductTable();
  }));
  document.getElementById('productTableBody').addEventListener('click', e=>{
    const btn = e.target.closest('button[data-act]'); if(!btn) return;
    const id = btn.closest('tr').dataset.id; const p = PRODUCTS.find(x=>x.id===id);
    if(btn.dataset.act==='view' || btn.dataset.act==='edit') openProductModal(p);
    if(btn.dataset.act==='dup'){
      const copy = Object.assign({}, p, {id:'P'+Math.floor(Math.random()*100000), sku:p.sku+'-COPY', name:p.name+' (Copy)', dateUpdated:todayISO()});
      PRODUCTS.push(copy); persistAll(); renderProductTable(); toast('Product duplicated (demo)', 'bi-copy');
    }
    if(btn.dataset.act==='archive'){ p.status='Archived'; persistAll(); renderProductTable(); toast('Product archived (demo)', 'bi-archive'); }
    if(btn.dataset.act==='del'){
      if(confirm('Delete this demo product? This only affects local demo data.')){ PRODUCTS = PRODUCTS.filter(x=>x.id!==id); persistAll(); renderProductTable(); toast('Product deleted (demo)', 'bi-trash'); }
    }
  });
  renderProductTable();
}
function renderProductTable(){
  const search = (document.getElementById('productSearch').value||'').toLowerCase();
  const cat = document.getElementById('productCatFilter').value, status = document.getElementById('productStatusFilter').value, type = document.getElementById('productTypeFilter').value;
  let list = PRODUCTS.filter(p=>(!search || p.name.toLowerCase().includes(search) || p.sku.toLowerCase().includes(search)) && (!cat||p.category===cat) && (!status||p.status===status) && (!type||p.type===type));
  document.getElementById('productTableBody').innerHTML = list.map(p=>`
    <tr data-id="${p.id}"><td><img class="table-thumb" src="${p.image}"></td><td>${p.name}</td><td>${p.sku}</td><td>${p.category}</td><td>${p.brand}</td><td>${p.type}</td>
    <td>${fmt(p.price)}</td><td>${p.promoPrice?fmt(p.promoPrice):'—'}</td><td>${fmt(p.cost)}</td><td>${p.weight} kg</td><td>${p.type==='Pre-Order'?'—':p.stock}</td><td>${statusPillHTML(p.status)}</td><td>${p.dateUpdated}</td>
    <td><button class="icon-btn" title="View" data-act="view"><i class="bi bi-eye"></i></button><button class="icon-btn" title="Edit" data-act="edit"><i class="bi bi-pencil"></i></button>
    <button class="icon-btn" title="Duplicate" data-act="dup"><i class="bi bi-copy"></i></button><button class="icon-btn" title="Archive" data-act="archive"><i class="bi bi-archive"></i></button>
    <button class="icon-btn" title="Delete" data-act="del"><i class="bi bi-trash"></i></button></td></tr>`).join('') || `<tr><td colspan="14" style="text-align:center; padding:30px" class="text-muted">No products match your filters.</td></tr>`;
}
function openProductModal(p){
  document.getElementById('productModalTitle').textContent = p ? 'Edit Product' : 'Add Product';
  const isPre = p ? p.type==='Pre-Order' : false;
  document.getElementById('productModalBody').innerHTML = `
    <div class="form-grid-2">
      <div class="form-row" id="f-pname"><label>Product Name <span class="req">*</span></label><input id="pName" value="${p?p.name:''}"><div class="field-error">Required.</div></div>
      <div class="form-row" id="f-psku"><label>SKU <span class="req">*</span></label><input id="pSku" value="${p?p.sku:''}"><div class="field-error">Required.</div></div>
    </div>
    <div class="form-grid-2">
      <div class="form-row" id="f-pcat"><label>Category <span class="req">*</span></label><select id="pCat">${CATEGORIES.map(c=>`<option ${p&&p.category===c?'selected':''}>${c}</option>`).join('')}</select><div class="field-error">Required.</div></div>
      <div class="form-row"><label>Brand</label><select id="pBrand">${BRANDS.map(b=>`<option ${p&&p.brand===b?'selected':''}>${b}</option>`).join('')}</select></div>
    </div>
    <div class="form-row" id="f-pdesc"><label>Description <span class="req">*</span></label><textarea id="pDesc" rows="2">${p?(p.description||''):''}</textarea><div class="field-error">Required.</div></div>
    <div class="form-grid-3">
      <div class="form-row" id="f-pprice"><label>Regular Price <span class="req">*</span></label><input type="number" id="pPrice" value="${p?p.price:''}"><div class="field-error">Required.</div></div>
      <div class="form-row"><label>Discount / Promo Price</label><input type="number" id="pPromo" value="${p&&p.promoPrice?p.promoPrice:''}"></div>
      <div class="form-row"><label>Cost</label><input type="number" id="pCost" value="${p?p.cost:''}"></div>
    </div>
    <div class="form-grid-3">
      <div class="form-row" id="f-pweight"><label>Product Weight (kg) <span class="req">*</span></label><input type="number" id="pWeight" value="${p?p.weight:''}"><div class="field-error">Required.</div></div>
      <div class="form-row"><label>Stock Quantity</label><input type="number" id="pStock" value="${p?p.stock:''}"></div>
      <div class="form-row"><label>Low-Stock Alert</label><input type="number" id="pLowStock" value="${p?p.lowStockAlert:10}"></div>
    </div>
    <div class="form-row"><label>Product Images</label><input type="file" id="pImages" multiple accept="image/*"><p class="text-muted" style="font-size:.75rem">Demo only — uploaded files are not stored.</p></div>
    <div class="form-row"><label>Loyalty Points</label><input type="number" id="pPoints" value="${p?p.points:0}"></div>
    <div class="form-grid-2">
      <div class="form-row"><label>Product Status (Active/Inactive)</label><select id="pStatus"><option ${p&&p.status==='Active'?'selected':''}>Active</option><option ${p&&p.status==='Draft'?'selected':''}>Draft</option><option ${p&&p.status==='Archived'?'selected':''}>Archived</option></select></div>
      <div class="form-row"><label>Product Type</label><select id="pType"><option value="Standard" ${!isPre?'selected':''}>Standard (Normal Sale)</option><option value="Pre-Order" ${isPre?'selected':''}>Pre-Order</option></select></div>
    </div>
    <div id="preorderFields" class="${isPre?'':'hidden'}">
      <div class="form-grid-2">
        <div class="form-row"><label>Pre-Order Open Date</label><input type="date" id="pPreOpen" value="${p&&p.preorder?p.preorder.openDate:''}"></div>
        <div class="form-row"><label>Pre-Order Closing Date</label><input type="date" id="pPreClose" value="${p&&p.preorder?p.preorder.closeDate:''}"></div>
      </div>
      <div class="form-row"><label>Expected Availability</label><input id="pPreExpected" value="${p&&p.preorder?p.preorder.expected:''}"></div>
    </div>
    <div class="page-title-row mt-16"><div></div><button class="btn btn-primary" id="saveProductBtn">Save Product</button></div>`;
  document.getElementById('pType').addEventListener('change', e=>document.getElementById('preorderFields').classList.toggle('hidden', e.target.value!=='Pre-Order'));
  document.getElementById('saveProductBtn').addEventListener('click', ()=>{
    let valid = true;
    [['pName','f-pname'],['pSku','f-psku'],['pCat','f-pcat'],['pDesc','f-pdesc'],['pPrice','f-pprice'],['pWeight','f-pweight']].forEach(([inputId,rowId])=>{
      const el = document.getElementById(inputId); const row = document.getElementById(rowId);
      if(!el.value.trim()){ row.classList.add('invalid'); valid=false; } else row.classList.remove('invalid');
    });
    if(!valid){ toast('Please complete all required fields', 'bi-exclamation-triangle'); return; }
    const data = {
      name:document.getElementById('pName').value, sku:document.getElementById('pSku').value, category:document.getElementById('pCat').value,
      brand:document.getElementById('pBrand').value, description:document.getElementById('pDesc').value,
      price:+document.getElementById('pPrice').value, promoPrice: document.getElementById('pPromo').value?+document.getElementById('pPromo').value:null,
      cost:+document.getElementById('pCost').value||0, weight:+document.getElementById('pWeight').value,
      stock:+document.getElementById('pStock').value||0, lowStockAlert:+document.getElementById('pLowStock').value||10,
      points:+document.getElementById('pPoints').value||0, status:document.getElementById('pStatus').value, type:document.getElementById('pType').value, dateUpdated: todayISO()
    };
    if(data.type==='Pre-Order'){ data.preorder = {openDate:document.getElementById('pPreOpen').value, closeDate:document.getElementById('pPreClose').value, expected:document.getElementById('pPreExpected').value, deposit:'30% Deposit'}; }
    if(p){ Object.assign(p, data); toast('Product updated (demo)', 'bi-check-circle-fill'); }
    else { data.id='P'+Math.floor(Math.random()*100000); data.image=svgThumb(data.name, HUES[data.category]); PRODUCTS.push(data); toast('Product added (demo)', 'bi-check-circle-fill'); }
    persistAll(); closeModal('productModal'); renderProductTable();
  });
  openModal('productModal');
}
renderAdminShell('products');
</script>
</body>
</html>
