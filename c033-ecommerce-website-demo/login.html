<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Sokha Beauty & Wellness (C033 Demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="account">

<div id="site-header"></div>

<div class="container">
  <div class="auth-wrap">
    <h2>Welcome Back</h2>
    <div class="sub">Login to your Sokha demo account</div>
    <div class="notice-box"><i class="bi bi-info-circle"></i> Demo login — Email: <b>customer@c033demo.com</b> / Password: <b>demo123</b>. Simulated authentication only, not secure production authentication.</div>
    <div class="form-row"><label>Email</label><input type="email" id="loginEmail" value="customer@c033demo.com"></div>
    <div class="form-row"><label>Password</label><input type="password" id="loginPassword" value="demo123"></div>
    <button class="btn btn-primary btn-block" id="loginBtn">Login</button>
    <p class="auth-switch"><a href="#" id="forgotPassLink">Forgot password?</a></p>
    <p class="auth-switch">Don't have an account? <a href="register.html">Register here</a></p>
  </div>
</div>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/layout.js"></script>
<script>
document.getElementById('loginBtn').addEventListener('click', ()=>{
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  if(email===DEMO_CUSTOMER.email && pass===DEMO_CUSTOMER.password){
    auth = {loggedIn:true, name:DEMO_CUSTOMER.name, email};
    persistState();
    toast('Logged in (simulated)','bi-person-check-fill');
    setTimeout(()=>window.location.href='profile.html', 600);
  } else {
    toast('Invalid demo credentials. Use customer@c033demo.com / demo123','bi-exclamation-triangle');
  }
});
document.getElementById('forgotPassLink').addEventListener('click', e=>{
  e.preventDefault();
  toast('Password reset link simulated — no real email sent (demo only).','bi-envelope-check');
});
</script>
</body>
</html>
