<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sampheap Guesthouse monogram">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B5744"/>
      <stop offset="100%" stop-color="#0B2F27"/>
    </linearGradient>
  </defs>

  <!-- Badge background -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#C89A43" stroke-width="4" opacity="0.9"/>

