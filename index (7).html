<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmation — Kanharoth Shop Demo</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="site-header" data-root="../" data-active="checkout"></div>

<section class="container" style="padding:50px 20px 70px;">
  <div class="success-card">
    <div class="success-icon" id="s-icon">✅</div>
    <h1 id="s-title" style="font-size:1.4rem;" data-i18n="success_title">Order Placed Successfully!</h1>
    <p data-i18n="success_desc">Thank you for your order! We've received it and will process it shortly.</p>

    <table class="order-detail-table">
      <tr><td data-i18n="order_no">Order Number</td><td id="d-id"></td></tr>
      <tr><td data-i18n="order_amount">Amount</td><td id="d-amount"></td></tr>
      <tr><td data-i18n="order_payment_method">Payment Method</td><td id="d-method"></td></tr>
      <tr><td data-i18n="order_customer">Customer</td><td id="d-customer"></td></tr>
      <tr><td data-i18n="order_date">Order Date</td><td id="d-date"></td></tr>
      <tr><td data-i18n="order_status">Status</td><td id="d-status"></td></tr>
    </table>

    <div style="display:flex;gap:10px;">
      <a href="../index.html" class="btn btn-outline btn-block" data-i18n="back_home">Back to Home</a>
      <a href="#" class="btn btn-primary btn-block" id="view-order-btn" data-i18n="view_order">View Order</a>
    </div>
    <p style="font-size:.72rem;color:var(--ink-faint);margin-top:18px;" data-i18n="success_demo_note">Demo payment confirmation for presentation only.</p>
  </div>
</section>

<div id="site-footer" data-root="../"></div>

<script src="../js/i18n.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/layout.js"></script>
<script>
function render(){
  const id = qparam("order");
  const order = getDemoOrder(id);
  if (!order){ location.href = "../shop/index.html"; return; }

  const methodLabel = {khqr:"KHQR", cod: getLang()==="km" ? "សាច់ប្រាក់ពេលដឹកជញ្ជូន" : "Cash on Delivery", bank: getLang()==="km" ? "ផ្ទេរប្រាក់ធនាគារ" : "Bank Transfer"};
  document.getElementById("d-id").textContent = order.id;
  document.getElementById("d-amount").textContent = money(order.total);
  document.getElementById("d-method").textContent = methodLabel[order.payment] + (order.payment==="khqr" ? " (Demo)" : "");
  document.getElementById("d-customer").textContent = order.customer;
  document.getElementById("d-date").textContent = fmtDate(order.date, getLang());

  const statusEl = document.getElementById("d-status");
  const badgeClass = order.paymentStatus === "paid" ? "paid" : (order.paymentStatus==="failed" ? "failed" : "pending");
  statusEl.innerHTML = `<span class="status-badge ${badgeClass}">${payLabel(order.paymentStatus)}</span>`;

  document.getElementById("view-order-btn").href = location.href;
  document.getElementById("s-icon").textContent = order.paymentStatus === "failed" ? "⚠️" : "✅";
  applyI18n();
}
document.addEventListener("DOMContentLoaded", render);
document.addEventListener("langchanged", render);
</script>
</body>
</html>
