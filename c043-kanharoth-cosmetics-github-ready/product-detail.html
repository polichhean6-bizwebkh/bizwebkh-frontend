<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Detail — Kanharoth Cosmetics Demo</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header" data-active="products"></div>

<div class="container">
  <div class="breadcrumb">
    <a href="index.html" data-i18n="nav_home">Home</a>
    <span>/</span>
    <a href="products.html" data-i18n="products_breadcrumb">Products</a>
    <span>/</span>
    <span id="crumb-name"></span>
  </div>
</div>

<section class="section tight">
  <div class="container">
    <div class="pd-wrap" id="pd-wrap"></div>

    <div class="tabs">
      <button type="button" class="tab-btn active" data-tab="desc" data-i18n="pd_tab_desc">Description</button>
      <button type="button" class="tab-btn" data-tab="spec" data-i18n="pd_tab_spec">Specification</button>
    </div>
    <div id="tab-desc" class="tab-panel"></div>
    <div id="tab-spec" class="tab-panel" style="display:none;"></div>
  </div>
</section>

<section class="section tight" style="background:#fff;border-top:1px solid var(--line);">
  <div class="container">
    <div class="section-head left">
      <div><h2 data-i18n="pd_related">Related Products</h2></div>
    </div>
    <div class="grid-products" id="related-grid"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/telegram.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
function handleAddToCartClick(btn, productId, qty){
  addToCart(productId, qty);
  const original = btn.innerHTML;
  btn.innerHTML = icon("check") + `<span>${t("added_to_cart")}</span>`;
  setTimeout(()=>{ btn.innerHTML = original; }, 1200);
}
function renderProductCard(p){
  const wrap = document.createElement("div");
  wrap.className = "product-card";
  const badge = badgeLabel(p.badge);
  const name = getLang()==="km" ? p.nameKm : p.name;
  wrap.innerHTML = `
    <a href="product-detail.html?id=${p.id}" class="thumb">
      <img src="${p.img}" alt="${p.name}" loading="lazy">
      ${badge ? `<span class="tag ${badge.cls==='sale'?'sale':''}">${badge.text}</span>` : ""}
    </a>
    <div class="body">
      <span class="cat" data-i18n="cat_${p.category}"></span>
      <a href="product-detail.html?id=${p.id}" class="title">${name}</a>
      <div class="price-row">
        <span class="price">${money(p.sale || p.price)}</span>
        ${p.sale ? `<span class="price-old">${money(p.price)}</span>` : ""}
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn btn-ghost add-cart-btn" data-i18n="add_to_cart"></button>
      <a href="product-detail.html?id=${p.id}" class="btn btn-primary" data-i18n="view_details"></a>
    </div>`;
  wrap.querySelector(".add-cart-btn").addEventListener("click", function(){ handleAddToCartClick(this, p.id, 1); });
  return wrap;
}

let currentProduct = null;
let currentQty = 1;

function renderPD(){
  const id = qparam("id");
  const p = PRODUCTS.find(x=>x.id===id) || PRODUCTS[0];
  currentProduct = p;
  const name = getLang()==="km" ? p.nameKm : p.name;
  document.getElementById("crumb-name").textContent = name;
  document.title = name + " — Kanharoth Cosmetics Demo";

  const badge = badgeLabel(p.badge);
  const wrap = document.getElementById("pd-wrap");
  wrap.innerHTML = `
    <div class="pd-gallery">
      <div class="main-img" id="pd-main-img"><img src="${p.img}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;"></div>
      <div class="pd-thumbs" id="pd-thumbs"></div>
    </div>
    <div class="pd-info">
      <span class="cat" data-i18n="cat_${p.category}"></span>
      <h1>${name}</h1>
      <div class="pd-price-row">
        <span class="pd-price">${money(p.sale || p.price)}</span>
        ${p.sale ? `<span class="price-old" style="font-size:1.1rem;">${money(p.price)}</span>` : ""}
        ${badge ? `<span class="tag" style="position:static;background:var(--primary);color:#fff;font-size:.62rem;font-weight:700;padding:5px 11px;border-radius:99px;text-transform:uppercase;">${badge.text}</span>` : ""}
      </div>
      <p style="color:var(--ink-soft);font-size:.92rem;">${(getLang()==="km" && p.descKm) ? p.descKm : p.desc}</p>

      <div style="margin-top:18px;">
        <label style="font-size:.8rem;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:8px;" data-i18n="pd_qty">Quantity</label>
        <div class="qty-selector">
          <button type="button" id="qty-minus" aria-label="Minus">−</button>
          <input type="text" id="qty-input" value="1" readonly>
          <button type="button" id="qty-plus" aria-label="Plus">+</button>
        </div>
      </div>

      <div class="pd-actions">
        <button type="button" class="btn btn-ghost" id="pd-add-cart" data-i18n="pd_add_cart">Add to Cart</button>
        <a href="#" id="pd-buy-telegram" target="_blank" rel="noopener" class="btn btn-telegram">${icon("send")} <span data-i18n="pd_buy_telegram">Order via Telegram</span></a>
      </div>

      <div class="pd-meta">
        <span><b data-i18n="pd_sku">SKU</b>: ${p.sku}</span>
        <span><b data-i18n="pd_category">Category</b>: <span data-i18n="cat_${p.category}"></span></span>
        <span><b data-i18n="pd_brand">Brand</b>: Kanharoth Cosmetics</span>
      </div>
    </div>`;

  const thumbs = document.getElementById("pd-thumbs");
  thumbs.innerHTML = "";
  (p.images || [p.img]).forEach((src,i)=>{
    const t = document.createElement("div");
    t.className = "th" + (i===0 ? " active" : "");
    t.innerHTML = `<img src="${src}" alt="" style="width:100%;height:100%;object-fit:cover;">`;
    t.addEventListener("click", ()=>{
      document.querySelectorAll(".pd-thumbs .th").forEach(el=>el.classList.remove("active"));
      t.classList.add("active");
      document.getElementById("pd-main-img").innerHTML = `<img src="${src}" alt="" style="width:100%;height:100%;object-fit:cover;">`;
    });
    thumbs.appendChild(t);
  });

  document.getElementById("tab-desc").innerHTML = `<p style="max-width:760px;color:var(--ink-soft);font-size:.92rem;line-height:1.7;">${(getLang()==="km" && p.descKm) ? p.descKm : p.desc}</p>`;
  document.getElementById("tab-spec").innerHTML = `
    <table class="spec-table" style="max-width:600px;">
      <tr><td data-i18n="pd_sku">SKU</td><td>${p.sku}</td></tr>
      <tr><td data-i18n="pd_category">Category</td><td data-i18n="cat_${p.category}"></td></tr>
      <tr><td data-i18n="pd_brand">Brand</td><td>Kanharoth Cosmetics</td></tr>
      <tr><td data-i18n="pd_size">Size</td><td>${p.size || "50ml"}</td></tr>
    </table>`;

  currentQty = 1;
  document.getElementById("qty-input").value = 1;

  const related = PRODUCTS.filter(x=>x.category===p.category && x.id!==p.id).slice(0,4);
  const relGrid = document.getElementById("related-grid");
  relGrid.innerHTML = "";
  related.forEach(r=> relGrid.appendChild(renderProductCard(r)));

  updateBuyTelegramLink();
  applyI18n();
}

function updateBuyTelegramLink(){
  if (!currentProduct) return;
  const name = getLang()==="km" ? currentProduct.nameKm : currentProduct.name;
  const price = currentProduct.sale || currentProduct.price;
  const msg = `🛍️ ${t("order_via_telegram")} — Kanharoth Cosmetics\n\n${name} x${currentQty} — ${money(price)} each = ${money(price*currentQty)}\n\nPlease confirm delivery details with me directly.`;
  const a = document.getElementById("pd-buy-telegram");
  if (a) a.href = telegramDirectLink(msg);
}

document.addEventListener("click", e=>{
  const tabBtn = e.target.closest(".tab-btn");
  if (tabBtn){
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    tabBtn.classList.add("active");
    document.querySelectorAll(".tab-panel").forEach(p=>p.style.display="none");
    document.getElementById("tab-"+tabBtn.dataset.tab).style.display = "block";
    return;
  }
  if (e.target.id === "qty-minus"){
    currentQty = Math.max(1, currentQty-1);
    document.getElementById("qty-input").value = currentQty;
    updateBuyTelegramLink();
    return;
  }
  if (e.target.id === "qty-plus"){
    currentQty = currentQty+1;
    document.getElementById("qty-input").value = currentQty;
    updateBuyTelegramLink();
    return;
  }
  if (e.target.id === "pd-add-cart"){
    handleAddToCartClick(e.target, currentProduct.id, currentQty);
    return;
  }
});

document.addEventListener("DOMContentLoaded", renderPD);
document.addEventListener("langchanged", renderPD);
</script>
</body>
</html>
